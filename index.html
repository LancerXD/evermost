<style>
  :root {
    --papel: #ffe2f0; --papel2: #f2bedc; --renglon: rgba(214,120,180,.28); --margen: #f06e96;
    --rosa: #e589c8; --rosaOscuro: #b6669d; --tinta: #461e48; --tintaSuave: #96588c; --menta: #70d6aa;
    --cieloArriba: #b0a0d6; --cieloAbajo: #ffcdbe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: #ffd9e8; }
  body {
    font-family: 'Gochi Hand', 'Comic Sans MS', cursive; color: var(--tinta); font-size: 21px; line-height: 1.35;
    background: linear-gradient(180deg, var(--cieloArriba) 0%, #e7b6d8 35%, var(--cieloAbajo) 70%, #ffd9e8 100%) fixed;
    min-height: 100vh; overflow-x: hidden;
  }
  #petalos { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; image-rendering: pixelated; }
  .pagina { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 18px 80px; }
  img.pixel { image-rendering: pixelated; }

  /* ---------- crayón: la orilla temblorosa va en un ::before con el filtro, así el texto queda limpio */
  .crayon { position: relative; }
  .crayon::before {
    content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 6px;
    background: var(--fondo, var(--papel)); border: 3px solid var(--tinta); filter: url(#crayon);
    box-shadow: 4px 5px 0 rgba(70,30,72,.22);
  }
  .crayon { isolation: isolate; }

  /* ---------- arriba */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; margin-bottom: 26px; }
  header .logo { grid-column: 2; text-align: center; }
  header .logo img { width: min(420px, 80vw); filter: drop-shadow(3px 4px 0 rgba(70,30,72,.3)); }
  header h1 {
    margin: 4px 0 0; font-size: clamp(34px, 6vw, 58px); color: var(--papel); letter-spacing: 1px;
    text-shadow: -3px 0 var(--tinta), 3px 0 var(--tinta), 0 -3px var(--tinta), 0 3px var(--tinta), -2px -2px var(--tinta), 2px 2px var(--tinta), -2px 2px var(--tinta), 2px -2px var(--tinta), 5px 6px 0 rgba(70,30,72,.3);
  }
  header .lado { display: flex; align-items: flex-end; gap: 10px; }
  header .lado.izq { justify-content: flex-end; } header .lado.der { justify-content: flex-start; }
  .sprite { height: 120px; image-rendering: pixelated; filter: drop-shadow(0 5px 0 rgba(70,30,72,.25)); animation: rebote 1.6s steps(2) infinite; }
  .sprite.b { animation-delay: .4s; }
  @keyframes rebote { 50% { transform: translateY(-4px); } }

  .aviso { display: inline-block; padding: 10px 26px; font-size: 30px; transform: rotate(-1.5deg); --fondo: var(--rosa); color: #fff6fb;
           text-shadow: 0 2px 0 var(--tintaSuave); }
  .centro { text-align: center; }

  /* ---------- columnas */
  .columnas { display: grid; grid-template-columns: 290px 1fr 270px; gap: 26px; margin-top: 26px; align-items: start; }
  @media (max-width: 900px) { .columnas { grid-template-columns: 1fr; } header { grid-template-columns: 1fr; } header .lado { display: none; } }
  .hoja { padding: 18px 20px; margin-bottom: 26px; }
  .hoja h2 { font-size: 28px; margin: 0 0 6px; color: var(--tinta); }
  .hoja p { margin: .45em 0; }
  .nota { --fondo: #fff6c8; transform: rotate(1.6deg); }
  .nota.rosa { --fondo: var(--papel); transform: rotate(-1.2deg); }

  /* hoja de cuaderno: renglones y la línea roja del margen (como el menú de pausa) */
  .cuaderno::before {
    background:
      linear-gradient(90deg, transparent 38px, var(--margen) 38px, var(--margen) 40px, transparent 40px),
      repeating-linear-gradient(180deg, transparent 0 27px, var(--renglon) 27px 29px),
      var(--papel);
  }
  .cuaderno { padding: 16px 20px 18px 54px; }
  .cinta { position: absolute; top: -13px; left: 50%; width: 92px; height: 26px; transform: translateX(-50%) rotate(-3deg);
           background: rgba(255,255,255,.55); border: 2px dashed rgba(182,102,157,.5); z-index: 2; }

  .actualizacion { margin-bottom: 34px; }
  .actualizacion:nth-child(odd) { transform: rotate(-.6deg); } .actualizacion:nth-child(even) { transform: rotate(.5deg); }
  .actualizacion .fecha { font-family: 'Pixelify Sans', monospace; font-size: 14px; color: var(--tintaSuave); }
  .actualizacion b { color: var(--rosaOscuro); }
  .fotos { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
  .foto { flex: 1 1 220px; padding: 8px; --fondo: #fff; }
  .foto img { display: block; width: 100%; border-radius: 3px; cursor: zoom-in; }
  .titulo-col { font-size: 34px; margin: 0 0 18px; text-align: center; color: var(--papel);
    text-shadow: -2px 0 var(--tinta), 2px 0 var(--tinta), 0 -2px var(--tinta), 0 2px var(--tinta), 4px 4px 0 rgba(70,30,72,.3); }

  .polaroid { padding: 10px 10px 34px; --fondo: #fff; transform: rotate(-3deg); margin-bottom: 26px; }
  .polaroid img { width: 100%; display: block; }
  .polaroid span { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 18px; color: var(--tintaSuave); }

  /* BUSCAME! */
  .buscame { font-family: 'Pixelify Sans', monospace; font-weight: 600; font-size: 26px; padding: 6px 16px; display: inline-block; --fondo: var(--rosa); color: #fff6fb; transform: rotate(2deg); }
  .flecha { display: block; width: 90px; margin: 4px auto 0; }
  #escondido { position: fixed; width: 34px; z-index: 3; opacity: .5; cursor: pointer; transition: transform .2s, opacity .2s; image-rendering: pixelated; }
  #escondido:hover { opacity: .85; transform: scale(1.15) rotate(-8deg); }
  #encontrado { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -20px) scale(.9); opacity: 0; pointer-events: none; z-index: 20;
                padding: 14px 26px; font-size: 30px; --fondo: #fff6c8; transition: all .35s; }
  #encontrado.si { opacity: 1; transform: translate(-50%, 0) scale(1); }

  footer { text-align: center; margin-top: 30px; font-family: 'Pixelify Sans', monospace; font-size: 15px; color: var(--tinta); opacity: .8; }

  /* ver una imagen en grande */
  #grande { position: fixed; inset: 0; background: rgba(70,30,72,.75); display: none; align-items: center; justify-content: center; z-index: 30; cursor: zoom-out; }
  #grande.si { display: flex; } #grande img { max-width: 92vw; max-height: 88vh; border: 4px solid var(--papel); border-radius: 6px; }
</style>
</head>

<script>
// ---------- llenar la página
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const conNegritas = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
$('aviso').textContent = PAGINA.aviso;
$('sobre').textContent = PAGINA.sobre;
$('ideas').innerHTML = PAGINA.ideas.map(t => `<p>${esc(t)}</p>`).join('');
$('yo').innerHTML = PAGINA.yo.map(t => `<p>${esc(t)}</p>`).join('');
$('gato').src = PAGINA.gato;
$('actualizaciones').innerHTML = ACTUALIZACIONES.map(a => `
  <article class="actualizacion hoja cuaderno crayon">
    <div class="cinta"></div>
    ${a.fecha ? `<div class="fecha">${esc(a.fecha)}</div>` : ''}
    <h2>${esc(a.titulo)}</h2>
    ${a.texto.map(t => `<p>${conNegritas(t)}</p>`).join('')}
    ${a.imagenes && a.imagenes.length ? `<div class="fotos">${a.imagenes.map(u => `<div class="foto crayon"><img src="${u}" loading="lazy" alt=""></div>`).join('')}</div>` : ''}
  </article>`).join('');

// ---------- ver una imagen en grande
document.addEventListener('click', e => {
  const g = $('grande');
  if (e.target.closest('.foto img, .polaroid img')) { g.querySelector('img').src = e.target.src; g.classList.add('si'); }
  else if (e.target.closest('#grande')) g.classList.remove('si');
});

// ---------- BUSCAME!: algo escondido entre los pétalos, en un lugar distinto cada vez
const esc2 = $('escondido');
esc2.src = PAGINA.escondido;
esc2.style.left = (6 + Math.random() * 86) + 'vw'; esc2.style.top = (18 + Math.random() * 70) + 'vh';
esc2.onclick = () => { $('encontrado').classList.add('si'); esc2.style.opacity = 1; setTimeout(() => $('encontrado').classList.remove('si'), 2600); };

// ---------- pétalos de cerezo cayendo (en pixeles, con contorno, como en el juego)
(() => {
  const c = $('petalos'), g = c.getContext('2d');
  const P = 3, FORMA = ['..XX..', '.XXXX.', 'XXXXXX', 'XXXXXX', '.XXXX.', '..X...'];
  const colores = ['#ffd4ea', '#f7b4d8', '#e589c8', '#fff0f7'];
  const sprites = colores.map(col => {
    const s = document.createElement('canvas'); s.width = (FORMA[0].length + 2) * P; s.height = (FORMA.length + 2) * P;
    const q = s.getContext('2d');
    FORMA.forEach((f, y) => [...f].forEach((ch, x) => { if (ch === 'X') { q.fillStyle = '#461e48'; q.fillRect(x * P, y * P, 3 * P, 3 * P); } }));
    FORMA.forEach((f, y) => [...f].forEach((ch, x) => { if (ch === 'X') { q.fillStyle = col; q.fillRect((x + 1) * P, (y + 1) * P, P, P); } }));
    return s;
  });
  let W, H, petalos = [];
  const tam = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  addEventListener('resize', tam); tam();
  const nuevo = (arriba) => ({ x: Math.random() * W, y: arriba ? -30 : Math.random() * H, v: 18 + Math.random() * 30, f: Math.random() * 6,
                               a: Math.random() * 6, va: (Math.random() - .5) * 2, s: sprites[(Math.random() * sprites.length) | 0], k: .8 + Math.random() * .8 });
  for (let i = 0; i < 38; i++) petalos.push(nuevo(false));
  let antes = performance.now();
  const paso = (t) => {
    const dt = Math.min(.05, (t - antes) / 1000); antes = t;
    g.clearRect(0, 0, W, H);
    for (const p of petalos) {
      p.f += dt; p.y += p.v * dt; p.x += Math.sin(p.f * 1.3) * 22 * dt; p.a += p.va * dt;
      if (p.y > H + 30) Object.assign(p, nuevo(true));
      g.save(); g.translate(Math.round(p.x), Math.round(p.y)); g.rotate(Math.round(p.a / (Math.PI / 4)) * Math.PI / 4);   // gira a saltitos (pixel)
      g.scale(p.k * Math.abs(Math.cos(p.f * 1.7)) + .25, p.k); g.drawImage(p.s, -p.s.width / 2, -p.s.height / 2); g.restore();
    }
    requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
})();
</script>
